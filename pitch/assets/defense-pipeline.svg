<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1170" viewBox="0 0 1100 1170" role="img" aria-labelledby="title desc">
  <title id="title">Promptbreak layered defense pipeline</title>
  <desc id="desc">A vertical request path through an input guard, target model, and output filter. The input guard can refuse before generation, while the output filter can redact leaked secrets before delivery.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6 0 12Z" fill="#EB811B"/>
    </marker>
    <style>
      .stage { fill: #F3F5F5; stroke: #EB811B; stroke-width: 3; }
      .branch { fill: #F8EFE7; stroke: #C86424; stroke-width: 2.5; }
      .eyebrow { font: 700 22px "Fira Sans", Arial, sans-serif; letter-spacing: 2px; fill: #C86424; }
      .label { font: 700 39px "Fira Sans", Arial, sans-serif; fill: #23373B; }
      .body { font: 500 25px "Fira Sans", Arial, sans-serif; fill: #596568; }
      .chip { font: 700 20px "Fira Sans", Arial, sans-serif; fill: #23373B; }
      .route { font: 700 20px "Fira Sans", Arial, sans-serif; letter-spacing: 1.5px; fill: #C86424; }
    </style>
  </defs>

  <rect x="2" y="2" width="1096" height="1166" rx="28" fill="#FAFAFA" stroke="#D3D8D7" stroke-width="3"/>
  <text x="68" y="64" class="eyebrow">REQUEST PATH</text>
  <text x="68" y="108" class="label">Defense in depth</text>
  <text x="68" y="142" class="body">Stop early when possible; inspect output before delivery.</text>

  <rect x="82" y="188" width="700" height="116" rx="22" class="stage"/>
  <circle cx="144" cy="246" r="31" fill="#EB811B"/>
  <path d="M130 246h28M144 232v28" stroke="#FFF" stroke-width="6" stroke-linecap="round"/>
  <text x="200" y="239" class="label">User input</text>
  <text x="200" y="273" class="body">untrusted request and conversation state</text>

  <path d="M432 304V350" stroke="#EB811B" stroke-width="6" marker-end="url(#arrow)"/>

  <rect x="82" y="368" width="700" height="198" rx="22" class="stage"/>
  <text x="124" y="414" class="eyebrow">01 · BEFORE GENERATION</text>
  <text x="124" y="462" class="label">Input guard</text>
  <rect x="124" y="492" width="158" height="43" rx="21" fill="#F1E4D7"/>
  <rect x="296" y="492" width="213" height="43" rx="21" fill="#F1E4D7"/>
  <rect x="523" y="492" width="214" height="43" rx="21" fill="#F1E4D7"/>
  <text x="203" y="521" text-anchor="middle" class="chip">HEURISTICS</text>
  <text x="402" y="521" text-anchor="middle" class="chip">LLM CLASSIFIER</text>
  <text x="630" y="521" text-anchor="middle" class="chip">CONTEXT CHECK</text>

  <path d="M782 466H842" stroke="#C86424" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
  <text x="826" y="448" text-anchor="end" class="route">BLOCK</text>
  <rect x="846" y="396" width="206" height="140" rx="22" class="branch"/>
  <text x="949" y="439" text-anchor="middle" class="eyebrow">SAFE EXIT</text>
  <text x="949" y="480" text-anchor="middle" class="label" font-size="31">Refusal</text>
  <text x="949" y="512" text-anchor="middle" class="body" font-size="21">no target call</text>

  <path d="M432 566V612" stroke="#EB811B" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="454" y="603" class="route">ALLOW</text>

  <rect x="82" y="630" width="700" height="128" rx="22" class="stage"/>
  <text x="124" y="676" class="eyebrow">02 · GENERATION</text>
  <text x="124" y="724" class="label">Target LLM</text>
  <text x="402" y="722" class="body">application response</text>

  <path d="M432 758V804" stroke="#EB811B" stroke-width="6" marker-end="url(#arrow)"/>

  <rect x="82" y="822" width="700" height="160" rx="22" class="stage"/>
  <text x="124" y="868" class="eyebrow">03 · BEFORE DELIVERY</text>
  <text x="124" y="916" class="label">Output filter</text>
  <text x="124" y="954" class="body">direct, Base64, hex, ROT13, and reversed leaks</text>

  <path d="M782 900H842" stroke="#C86424" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
  <text x="826" y="882" text-anchor="end" class="route">LEAK</text>
  <rect x="846" y="830" width="206" height="140" rx="22" class="branch"/>
  <text x="949" y="873" text-anchor="middle" class="eyebrow">SAFE EXIT</text>
  <text x="949" y="914" text-anchor="middle" class="label" font-size="31">Redact</text>
  <text x="949" y="946" text-anchor="middle" class="body" font-size="21">secret removed</text>

  <path d="M432 982V1032" stroke="#557A46" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="454" y="1023" class="route" fill="#557A46">CLEAN</text>
  <rect x="82" y="1050" width="700" height="82" rx="22" fill="#EDF3EE" stroke="#557A46" stroke-width="2.5"/>
  <path d="M124 1091l16 16 31-38" fill="none" stroke="#557A46" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="202" y="1087" class="eyebrow" fill="#557A46">DELIVER</text>
  <text x="202" y="1118" class="body" font-size="21">only clean output reaches the client</text>
</svg>
