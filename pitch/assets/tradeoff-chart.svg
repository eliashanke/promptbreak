<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650">
  <defs>
    <style>
      .axis { font: 600 19px "Fira Sans", Arial, sans-serif; fill: #596568; }
      .label { font: 700 21px "Fira Sans", Arial, sans-serif; fill: #23373B; }
      .small { font: 500 16px "Fira Sans", Arial, sans-serif; fill: #596568; }
      .kicker { font: 700 15px "Fira Sans", Arial, sans-serif; letter-spacing: 1.2px; fill: #C86424; }
      .big { font: 700 38px "Fira Sans", Arial, sans-serif; fill: #23373B; }
      .equation { font: 700 42px "Fira Sans", Arial, sans-serif; fill: #23373B; }
      .panel-label { font: 600 17px "Fira Sans", Arial, sans-serif; fill: #596568; }
      .marker-count { font: 700 12px "Fira Sans", Arial, sans-serif; fill: #FAFAFA; }
    </style>
  </defs>
  <rect width="1500" height="650" rx="28" fill="#FAFAFA" stroke="#D3D8D7" stroke-width="2"/>
  <rect x="115" y="315" width="455" height="245" fill="#F1E4D7"/>
  <rect x="570" y="315" width="455" height="245" fill="#F3F5F5"/>
  <g stroke="#D3D8D7" stroke-width="2" fill="none">
    <path d="M115 70V560H1025"/><path d="M115 315H1025"/><path d="M570 70V560"/>
    <path d="M115 192H1025M115 437H1025" stroke-dasharray="6 8"/>
    <path d="M342 70V560M797 70V560" stroke-dasharray="6 8"/>
  </g>
  <text x="570" y="625" text-anchor="middle" class="axis">FALSE POSITIVE RATE → lower is better</text>
  <text x="30" y="315" text-anchor="middle" class="axis" transform="rotate(-90 30 315)">ATTACK SUCCESS RATE → lower is better</text>
  <text x="115" y="590" text-anchor="middle" class="axis">0%</text><text x="570" y="590" text-anchor="middle" class="axis">50%</text><text x="1025" y="590" text-anchor="middle" class="axis">100%</text>
  <text x="82" y="560" text-anchor="end" class="axis">0%</text><text x="82" y="321" text-anchor="end" class="axis">50%</text><text x="82" y="78" text-anchor="end" class="axis">100%</text>
  <text x="140" y="535" class="small" fill="#C86424">TARGET: ATTACKS BLOCKED, BENIGN INPUTS PASS</text>
  <g>
    <circle cx="115" cy="70" r="11" fill="#7B878A"/>
    <text x="115" y="74" text-anchor="middle" class="marker-count">3</text>
    <circle cx="1025" cy="315" r="14" fill="#EB811B"/>
    <circle cx="1025" cy="560" r="14" fill="#23373B"/>
  </g>
  <text x="145" y="72" class="label">Three configurations overlap here</text>
  <text x="145" y="98" class="small">Prompt only · Llama Guard · ShieldGemma</text>
  <text x="145" y="122" class="small">ASR 100% · FPR 0%</text>
  <text x="990" y="282" text-anchor="end" class="label">Promptbreak Guard</text>
  <text x="990" y="308" text-anchor="end" class="small">ASR 50% · FPR 100%</text>
  <text x="990" y="520" text-anchor="end" class="label">Full Pipeline</text>
  <text x="990" y="546" text-anchor="end" class="small">ASR 0% · FPR 100%</text>

  <text x="1025" y="42" text-anchor="end" class="kicker">CURRENT SMOKE TEST · 2 ATTACK + 2 BENIGN · ONE RUN</text>

  <g transform="translate(1070,70)">
    <rect width="380" height="490" rx="22" fill="#F3F5F5" stroke="#D3D8D7" stroke-width="2"/>
    <text x="28" y="45" class="kicker">PLANNED EVALUATION SIZE</text>

    <text x="190" y="119" text-anchor="middle" class="equation">30 × 5 × 3</text>
    <g class="small">
      <text x="72" y="151" text-anchor="middle">cases</text>
      <text x="190" y="151" text-anchor="middle">configurations</text>
      <text x="307" y="151" text-anchor="middle">repetitions</text>
    </g>

    <path d="M28 184H352" stroke="#D3D8D7" stroke-width="2"/>

    <text x="190" y="255" text-anchor="middle" class="big" fill="#C86424">450</text>
    <text x="190" y="288" text-anchor="middle" class="label">case–configuration observations</text>
    <text x="190" y="316" text-anchor="middle" class="panel-label">after warm-up</text>

    <rect x="24" y="348" width="332" height="78" rx="14" fill="#F1E4D7"/>
    <text x="42" y="378" class="label">Per configuration</text>
    <text x="42" y="405" class="panel-label">15 attacks + 15 benign cases</text>

    <text x="28" y="452" class="small">Not included:</text>
    <text x="28" y="475" class="small">warm-up calls and Rainbow-Lite generations</text>
  </g>
</svg>
