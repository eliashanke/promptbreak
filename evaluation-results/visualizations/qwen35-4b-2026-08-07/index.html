<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promptbreak evaluation visualizations</title>
  <style>
    :root { color: #23373B; background: #ecefed; font-family: "Fira Sans", Arial, sans-serif; }
    body { max-width: 1500px; margin: 0 auto; padding: 32px; }
    h1 { margin: 0 0 8px; } p { color: #596568; margin: 0 0 28px; }
    section { background: #FAFAFA; border: 1px solid #D3D8D7; border-radius: 16px; padding: 18px; margin: 0 0 28px; }
    h2 { margin: 0 0 14px; font-size: 20px; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>Promptbreak evaluation</h1>
  <p>150 static observations plus a 24-iteration Rainbow-Lite run.</p>
  <section><h2>Security–utility trade-off</h2><img src="security-utility.svg" alt="Security–utility trade-off"></section>
<section><h2>Category-level behavior</h2><img src="category-heatmaps.svg" alt="Category-level behavior"></section>
<section><h2>Latency and compute</h2><img src="latency-compute.svg" alt="Latency and compute"></section>
<section><h2>Rainbow-Lite archive</h2><img src="rainbow-lite.svg" alt="Rainbow-Lite archive"></section>
</body>
</html>
